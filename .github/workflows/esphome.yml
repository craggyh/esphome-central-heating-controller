name: ESPHome validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ESPHome
        run: pip install "esphome==2026.8.0"

      - name: Validate assembled controller configuration
        run: esphome config controller.yaml

      - name: Compile firmware
        run: esphome compile controller.yaml
