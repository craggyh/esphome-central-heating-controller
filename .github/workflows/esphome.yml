name: ESPHome validation

on:
  pull_request:

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache ESPHome build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .esphome/platformio
          key: ${{ runner.os }}-esphome-2026.8.0-${{ hashFiles('controller.yaml', 'central-heating.yaml', 'overrides/**/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-esphome-2026.8.0-

      - name: Install ESPHome
        run: pip install "esphome==2026.8.0"

      - name: Validate assembled controller configuration
        run: esphome config controller.yaml

      - name: Compile firmware
        run: esphome compile controller.yaml
